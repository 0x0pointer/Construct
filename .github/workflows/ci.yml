name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Queue + findings tests (db marker) skip without PRSEC_TEST_DATABASE_URL
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prsec
          POSTGRES_PASSWORD: prsec
          POSTGRES_DB: prsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prsec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PRSEC_TEST_DATABASE_URL: postgresql://prsec:prsec@localhost:5432/prsec

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # SonarCloud needs full history

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"  # lowest supported (requires-python >=3.12)

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint skills
        run: prsec-skills-lint prsec-skills

      - name: Run tests with coverage
        run: |
          pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
