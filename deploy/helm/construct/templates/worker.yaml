apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {{- include "construct.labels" (dict "name" "worker" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: worker}}
  template:
    metadata:
      labels: {{- include "construct.labels" (dict "name" "worker" "root" .) | nindent 8 }}
      annotations: {checksum/policy: {{ .Values.policy | sha256sum }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {{- include "construct.podSecurity" . | nindent 8 }}
      initContainers: {{- include "construct.migrate" . | nindent 8 }}
          volumeMounts: {{- include "construct.prsecMounts" . | nindent 12 }}
      containers:
        - name: worker
          image: {{ .Values.images.prsec }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [prsec-worker]
          env:
            {{- include "construct.prsecEnv" . | nindent 12 }}
            - {name: PRSEC_RUNNER, value: launcher}
            - {name: PRSEC_LAUNCHER_URL, value: "http://launcher:8090"}
            - name: PRSEC_LAUNCHER_TOKEN
              valueFrom: {secretKeyRef: {name: construct-secrets, key: launcherToken}}
            # Workbenches resolve llm-gateway through hostAliases / the env sink, the worker through cluster DNS.
            - {name: PRSEC_GATEWAY_URL, value: "http://llm-gateway:4000"}
            - name: PRSEC_GATEWAY_DEV_KEY
              valueFrom: {secretKeyRef: {name: construct-secrets, key: gatewayKey}}
            - {name: PRSEC_GATEWAY_MASTER_KEY, value: ""}
            - {name: PRSEC_WORKER_CONCURRENCY, value: {{ .Values.worker.concurrency | quote }}}
            - {name: PRSEC_DEBOUNCE_S, value: {{ .Values.worker.debounceS | quote }}}
            - {name: PRSEC_RECONCILE_INTERVAL_S, value: {{ .Values.worker.reconcileIntervalS | quote }}}
            - {name: PRSEC_SINK_IMAGE, value: {{ .Values.images.prsec }}}
          securityContext: {{- include "construct.containerSecurity" . | nindent 12 }}
          volumeMounts: {{- include "construct.prsecMounts" . | nindent 12 }}
          resources: {requests: {memory: 256Mi, cpu: 100m}, limits: {memory: 1Gi}}
      volumes: {{- include "construct.prsecVolumes" . | nindent 8 }}
