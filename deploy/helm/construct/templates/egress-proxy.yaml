# Package registries only, for the dynamic phase's install/build commands (prsec/dynamic/egress_proxy.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  labels: {{- include "construct.labels" (dict "name" "egress-proxy" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: egress-proxy}}
  template:
    metadata:
      labels: {{- include "construct.labels" (dict "name" "egress-proxy" "root" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "construct.pullSecrets" . | nindent 6 }}
      securityContext: {{- include "construct.podSecurity" . | nindent 8 }}
      containers:
        - name: egress-proxy
          image: {{ .Values.images.prsec }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [prsec-egress-proxy]
          env:
            - {name: PRSEC_LOG_FORMAT, value: json}
            - {name: PRSEC_EGRESS_ALLOW, value: {{ .Values.egressProxy.allow | quote }}}
          ports: [{containerPort: 3128}]
          readinessProbe: {tcpSocket: {port: 3128}, periodSeconds: 5}
          securityContext: {{- include "construct.containerSecurity" . | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources: {requests: {memory: 64Mi, cpu: 50m, ephemeral-storage: 16Mi}, limits: {memory: 256Mi, ephemeral-storage: 128Mi}}
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  labels: {{- include "construct.labels" (dict "name" "egress-proxy" "root" .) | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: egress-proxy}
  ports: [{port: 3128, targetPort: 3128}]
