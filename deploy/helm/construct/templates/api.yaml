apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "construct.labels" (dict "name" "api" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: api}}
  template:
    metadata:
      labels: {{- include "construct.labels" (dict "name" "api" "root" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "construct.podSecurity" . | nindent 8 }}
      initContainers: {{- include "construct.migrate" . | nindent 8 }}
          volumeMounts: {{- include "construct.prsecMounts" . | nindent 12 }}
      containers:
        - name: api
          image: {{ .Values.images.prsec }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [prsec-api]
          env:
            {{- include "construct.prsecEnv" . | nindent 12 }}
            - {name: PRSEC_API_PORT, value: "8080"}
            - {name: PRSEC_DEBOUNCE_S, value: {{ .Values.worker.debounceS | quote }}}
            - name: PRSEC_GITHUB_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: construct-secrets, key: webhookSecret}}
            - name: PRSEC_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: construct-secrets, key: adminToken}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          securityContext: {{- include "construct.containerSecurity" . | nindent 12 }}
          volumeMounts: {{- include "construct.prsecMounts" . | nindent 12 }}
          resources: {requests: {memory: 128Mi, cpu: 50m}, limits: {memory: 512Mi}}
      volumes: {{- include "construct.prsecVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "construct.labels" (dict "name" "api" "root" .) | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{port: 8080, targetPort: 8080}]
