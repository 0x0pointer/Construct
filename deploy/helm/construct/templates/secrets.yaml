apiVersion: v1
kind: Secret
metadata:
  name: construct-secrets
  labels: {app.kubernetes.io/part-of: construct}
type: Opaque
stringData:
  {{- range $key := list "dbPassword" "launcherToken" "gatewayKey" "adminToken" "webhookSecret" }}
  {{ $key }}: {{ include "construct.secret" (dict "root" $ "key" $key) | quote }}
  {{- end }}
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
  openaiApiKey: {{ .Values.secrets.openaiApiKey | quote }}
{{- if .Values.github.privateKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: construct-github
  labels: {app.kubernetes.io/part-of: construct}
type: Opaque
stringData:
  app.pem: {{ .Values.github.privateKey | quote }}
{{- end }}
