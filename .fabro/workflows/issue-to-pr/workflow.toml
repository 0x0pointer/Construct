_version = 1

# Issue -> spec -> human approval -> code -> checks -> independent review
# -> draft PR, for Construct.
#
# Run one issue (from the repo root):
#   fabro run .fabro/workflows/issue-to-pr/workflow.toml -I issue=<number>
# Without -I issue, and when started by a Fabro automation (the Run button in
# the web UI), the run picks the oldest approved issue not yet picked up.
#
# No secrets belong in this file. Keys and tokens live in Fabro's vault
# (`fabro secret set ...`), never in the repository.

[workflow]
graph = "workflow.fabro"

[run.inputs]
# Issue number to work on, passed with -I issue=<number>. "0" lets the run
# pick the oldest open issue that carries approval_label and none of the
# three labels below. Automations cannot pass inputs, so they always get "0".
issue = "0"
# Label a maintainer adds to release an issue to the pipeline.
approval_label = "fabro-approved"
# Label the run adds to the issue it accepts. While any open issue carries
# it, automation runs pick no other issue: one build at a time. The last step
# of the run replaces it with built_label or failed_label. If a run was
# killed and the label stayed behind, remove it by hand.
in_progress_label = "fabro-in-progress"
# How the run ended. Automation runs skip issues carrying either; remove the
# label to have the issue built again.
built_label = "fabro-built"
failed_label = "fabro-failed"
# GitHub logins allowed to release an issue (comma separated, no spaces).
maintainers = "RiieCco,blabla1337,JorgeCarvalhoPT"

# Retry budgets. When a budget is used up the run pauses and asks a human.
# Failed verifications in a row that the cheap model may try to fix.
max_cheap_fixes = "2"
# Failed verifications in a row before a human is asked (the strong model
# handles the attempts after max_cheap_fixes).
max_fix_attempts = "4"
# Times the reviewer may reject the change before a human is asked.
max_review_rounds = "3"

# Review depth. A change gets the cheaper reviewer only if it is at most this
# many changed lines, the spec says "Risk level: low", and it touches none of
# the paths below. Everything else goes to the strong reviewer.
max_light_review_lines = "40"
# Comma separated, no spaces. Matched as substrings of changed non-test paths.
sensitive_paths = "auth,secret,token,crypt,password,sandbox,policy,gateway,egress,proxy,orchestrator,launcher,adapters,dynamic,prsec/api,prsec/db,config,Dockerfile,pyproject.toml,requirements"

# Default model for any stage the stylesheet in workflow.fabro does not cover.
# Per-stage models (strong / balanced / cheap) are set in that stylesheet.
[run.model]
name = "gpt-5.4"

[run.environment]
id = "construct"

[environments.construct]
provider = "docker"

[environments.construct.image]
# Built from .fabro/docker/Dockerfile
docker = "construct-fabro:latest"

[environments.construct.resources]
cpu = 1
memory = "1500MB"

[run.pull_request]
enabled = true
draft = true

[run.integrations.github.permissions]
issues = "write"
contents = "write"
pull_requests = "write"
