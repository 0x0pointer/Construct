sonar.projectKey=0x0pointer_Construct
sonar.organization=0x0pointer

sonar.projectName=Construct
sonar.projectVersion=0.1.0

# images/ and deploy/ are included so Dockerfiles and the compose stack get IaC analysis.
sonar.sources=prsec,images,deploy
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/*.pyc
sonar.coverage.exclusions=images/**,deploy/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Use bundled JRE — avoids scanner 7.x JRE provisioning API call that
# fails before authentication and incorrectly reports a token error.
sonar.scanner.javaVersion=BUNDLED

# ── Documented rule exclusions ────────────────────────────────────────────────
# None yet. Add each one scoped as narrowly as possible, with the reason it is
# intentional or a false positive, so real issues elsewhere still surface.
# Note: prsec-skills/evals/cases/** contains deliberately vulnerable fixture apps
# (eval corpus) and is outside sonar.sources on purpose.
