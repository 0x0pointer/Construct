{% extends "base.html" %}
{% block title %}Findings{% endblock %}
{% block content %}
<h1>Findings</h1>
<form class="filters" method="get" hx-get="/findings" hx-target="#findings-table" hx-push-url="true"
      hx-trigger="change, submit">
  {% for key in ['repo', 'label', 'bug_class', 'severity', 'triage_state', 'status'] %}
  <label>{{ key | replace('_', ' ') }}
    <select name="{{ key }}"><option value="">any</option>
      {% for v in options[key] %}<option {% if filters[key] == v %}selected{% endif %}>{{ v }}</option>{% endfor %}
    </select></label>
  {% endfor %}
  <noscript><button type="submit">Filter</button></noscript>
</form>
<div id="findings-table">{% include "_findings_table.html" %}</div>
{% endblock %}
