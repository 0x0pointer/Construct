<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PRSec{% endblock %} · PRSec</title>
<link rel="stylesheet" href="{{ request.url_for('static', path='dashboard.css') }}">
<script src="{{ request.url_for('static', path='dashboard.js') }}" defer></script>
</head>
<body class="site-shell">
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/">PRSec</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/">Scans</a>
      <a href="/findings">Findings</a>
      <a href="/metrics">Metrics</a>
    </nav>
  {% if user %}<span class="user">{{ user }}</span>{% endif %}
  </div>
</header>
<main class="page-shell">{% block content %}{% endblock %}</main>
</body>
</html>
