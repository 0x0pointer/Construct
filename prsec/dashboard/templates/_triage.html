<div class="section-heading">
  <h2>Triage <span class="badge tr-{{ f.triage_state }}">{{ f.triage_state }}</span>
    {% if saved %}<span class="saved">saved</span>{% endif %}</h2>
</div>
{% if f.triage_note %}<p class="muted prose">{{ f.triage_note }}</p>{% endif %}
<form method="post" action="/findings/{{ f.id }}/triage" data-dashboard-triage data-partial-target="triage-panel">
  <fieldset class="choice-group">
    <legend class="muted">Decision</legend>
  {% for s in triage_states if s != 'new' %}
    <label><input type="radio" name="state" value="{{ s }}" {% if f.triage_state == s %}checked{% endif %} required> {{ s }}</label>
  {% endfor %}
  </fieldset>
  <p><label for="triage-note" class="muted">Note</label><br>
     <textarea id="triage-note" name="note" rows="4" placeholder="Note (why tp / fp / accepted)"></textarea></p>
  <button type="submit">Save triage</button>
</form>
