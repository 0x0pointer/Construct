<div class="section-heading">
  <h2>Triage <span class="badge tr-{{ f.triage_state }}">{{ f.triage_state }}</span>
    {% if saved %}<span class="saved">saved</span>{% endif %}</h2>
  <p class="muted">The POST route remains authoritative for triage validation and persistence.</p>
</div>
{% if f.triage_note %}<p class="muted pre-wrap">{{ f.triage_note }}</p>{% endif %}
<form method="post" action="/findings/{{ f.id }}/triage" data-dashboard-partial="true" data-target="triage-panel">
  <div class="stack">
    <fieldset class="choice-group">
      <legend class="sr-only">Select triage state</legend>
      {% for s in triage_states if s != 'new' %}
      <label><input type="radio" name="state" value="{{ s }}" {% if f.triage_state == s %}checked{% endif %} required> {{ s }}</label>
      {% endfor %}
    </fieldset>
    <label for="triage-note" class="field-group">Note
      <textarea id="triage-note" name="note" rows="3" placeholder="Note (why tp / fp / accepted)"></textarea>
    </label>
    <button type="submit">Save triage</button>
  </div>
</form>
