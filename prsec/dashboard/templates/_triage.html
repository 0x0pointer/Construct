<h2 style="margin-top:0">Triage <span class="badge tr-{{ f.triage_state }}">{{ f.triage_state }}</span>
  {% if saved %}<span class="saved">saved</span>{% endif %}</h2>
{% if f.triage_note %}<p class="muted" style="white-space: pre-wrap">{{ f.triage_note }}</p>{% endif %}
<form method="post" action="/findings/{{ f.id }}/triage"
      hx-post="/findings/{{ f.id }}/triage" hx-target="#triage-panel" hx-swap="innerHTML">
  <p>
  {% for s in triage_states if s != 'new' %}
    <label><input type="radio" name="state" value="{{ s }}" {% if f.triage_state == s %}checked{% endif %} required> {{ s }}</label>
  {% endfor %}
  </p>
  <p><label for="triage-note" class="muted">Note</label><br>
     <textarea id="triage-note" name="note" rows="3" style="width:100%" placeholder="Note (why tp / fp / accepted)"></textarea></p>
  <button type="submit">Save triage</button>
</form>
