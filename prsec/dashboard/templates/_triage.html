<h2>Triage <span class="badge tr-{{ f.triage_state }}">{{ f.triage_state }}</span>
  {% if saved %}<span class="saved">saved</span>{% endif %}</h2>
{% if f.triage_note %}<p class="muted preserve">{{ f.triage_note }}</p>{% endif %}
<form method="post" action="/findings/{{ f.id }}/triage"
      data-async-form data-target="triage-panel">
  <fieldset class="choice-list">
    <legend class="muted">Decision</legend>
  {% for s in triage_states if s != 'new' %}
    <label><input type="radio" name="state" value="{{ s }}" {% if f.triage_state == s %}checked{% endif %} required> {{ s }}</label>
  {% endfor %}
  </fieldset>
  <p><label for="triage-note">Note
     <textarea id="triage-note" name="note" rows="3" placeholder="Note (why tp / fp / accepted)"></textarea></label></p>
  <button type="submit">Save triage</button>
</form>
